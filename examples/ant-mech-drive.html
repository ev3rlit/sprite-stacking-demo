<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six-Legged Cargo Mech · Driving Demo</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Apple SD Gothic Neo",sans-serif;background:#151a1c;color:#ecece2;--lime:#d7e69e;--muted:#a7aca2;--line:#3b4546}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center}
main{width:min(1376px,100%);padding:clamp(14px,3vw,40px)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:17px}
h1{font-size:clamp(24px,4.2vw,41px);letter-spacing:-.065em;margin:0;line-height:1.12;font-weight:760}
#status{font-size:13px;color:var(--lime);display:flex;align-items:center;gap:8px;white-space:nowrap}
#status::before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%;box-shadow:0 0 10px #d7e69466}
#stage{height:clamp(360px,72svh,820px);position:relative;overflow:hidden;border:1px solid var(--line);background:#252e31;isolation:isolate}
#stage::after{content:"";pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 60px #10181960}
#world{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair}
#stage:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#reset{background:#171f21ec;color:#eeeee4;border:1px solid #536063;font:inherit;font-size:13px;padding:9px 13px;cursor:pointer}
#reset:hover,#reset:focus-visible{border-color:var(--lime);color:var(--lime)}
#load-error{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:18px;background:#252e31;text-align:center}
#load-error[hidden]{display:none}
footer{margin-top:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 19px}
.keys{display:inline-flex;gap:3px;margin-right:6px}
kbd{display:inline-grid;place-items:center;min-width:22px;height:23px;background:#232b2d;border:1px solid #4b5758;color:#ebede0;font:12px ui-monospace,monospace}
kbd.on{background:var(--lime);border-color:var(--lime);color:#212525}
#touch{display:none;position:absolute;bottom:14px;left:14px;gap:4px;grid-template:repeat(2,42px)/repeat(3,42px);z-index:1;touch-action:none}
#touch button{font-size:17px;color:#eee;background:#172022dc;border:1px solid #65716e;touch-action:none;user-select:none}
#touch button.on{background:var(--lime);color:#212525}
#touch button[data-code=KeyW]{grid-column:2}#touch button[data-code=KeyA]{grid-row:2;grid-column:1}
#touch button[data-code=KeyS]{grid-row:2;grid-column:2}#touch button[data-code=KeyD]{grid-row:2;grid-column:3}
@media(pointer:coarse){#touch{display:grid}}
@media(max-width:460px){#stage{height:66svh}.controls{gap:4px 10px}footer{align-items:flex-start}#reset{white-space:nowrap}}
</style>
</head>
<body>
<main>
<header><h1>Six-Legged Cargo Mech</h1><div id="status">Loading</div></header>
<section id="stage" tabindex="0" aria-label="Mech driving area">
<canvas id="world" aria-label="Sprite-stacked six-legged mech driving view"></canvas>
<p id="load-error" hidden>Could not load the mech images. Reload the page.</p>
<div id="touch" aria-label="Touch movement">
<button type="button" data-code="KeyW" aria-label="Up">↑</button><button type="button" data-code="KeyA" aria-label="Left">←</button><button type="button" data-code="KeyS" aria-label="Down">↓</button><button type="button" data-code="KeyD" aria-label="Right">→</button>
</div>
</section>
<footer>
<div class="controls"><span><span class="keys"><kbd data-code="KeyW">W</kbd><kbd data-code="KeyA">A</kbd><kbd data-code="KeyS">S</kbd><kbd data-code="KeyD">D</kbd></span>Move</span><span>Aim with the mouse</span></div>
<button id="reset" type="button">Reset Position</button>
</footer>

const canvas = document.querySelector("#world");
const stage = document.querySelector("#stage");
const ctx = canvas.getContext("2d");
const model = document.createElement("canvas");
const layers = model.getContext("2d");
const mask = document.createElement("canvas");
const maskCtx = mask.getContext("2d");
const status = document.querySelector("#status");
const keys = new Set();
const controls = new Set(["KeyW", "KeyA", "KeyS", "KeyD"]);
const squash = 0.72;
const worldLimit = 570;
const initialTurn = Math.PI * 0.27;
const state = { x: 0, y: 0, vx: 0, vy: 0, turn: initialTurn, phase: 0, gait: 0 };
const camera = { x: 0, y: 0 };
const pointer = { active: false, clientX: 0, clientY: 0 };
const legs = [-1, 1].flatMap((side, pair) => [-1, 0, 1].map((station, row) => ({
  art: station === 0 ? art.center : art.angled,
  side, station,
  hipX: side * 20,
  hipY: [-32, 0, 32][row],
  group: (pair + row) % 2,

let previousTime = 0;
let displayScale = 3;
const wrap = (radians) => Math.atan2(Math.sin(radians), Math.cos(radians));
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const ease = (t) => t * t * (3 - 2 * t);

async function loadStrip(part) {
  const image = new Image();
  image.src = part.uri;
  await image.decode();
  if (image.naturalWidth !== part.w * part.n || image.naturalHeight !== part.h) {
    throw new Error("Unexpected sprite strip dimensions");
  }
  part.image = image;
}

function resize() {
  const { clientWidth, clientHeight } = stage;
  displayScale = Math.max(1, Math.min(4, Math.floor(Math.min(clientWidth / 168, clientHeight / 192))));
  canvas.width = Math.max(1, Math.ceil(clientWidth / displayScale));
  canvas.height = Math.max(1, Math.ceil(clientHeight / displayScale));
  model.width = mask.width = 192;
  model.height = mask.height = 192;
  ctx.imageSmoothingEnabled = layers.imageSmoothingEnabled = maskCtx.imageSmoothingEnabled = false;
}

function setKey(code, down) {
  if (down) keys.add(code);
  else keys.delete(code);
  document.querySelectorAll('[data-code="' + code + '"]').forEach(element => element.classList.toggle("on", down));
}
function clearKeys() {
  for (const code of controls) setKey(code, false);
}
function reset() {
  Object.assign(state, { x: 0, y: 0, vx: 0, vy: 0, turn: initialTurn, phase: 0, gait: 0 });
  Object.assign(camera, { x: 0, y: 0 });
  pointer.active = false;
  clearKeys();
}
function aim(event) {
  Object.assign(pointer, { active: true, clientX: event.clientX, clientY: event.clientY });
}

  const box = canvas.getBoundingClientRect();
  return {
    x: (pointer.clientX - box.left) * canvas.width / box.width,
    y: (pointer.clientY - box.top) * canvas.height / box.height,

}

function origin() {
  return { x: canvas.width * 0.5, y: canvas.height * 0.65 };
}
function groundPoint(x, y) {
  const base = origin();
  return { x: base.x + x - camera.x, y: base.y + (y - camera.y) * squash };

function update(dt) {
  const inputX = Number(keys.has("KeyD")) - Number(keys.has("KeyA"));
  const inputY = Number(keys.has("KeyS")) - Number(keys.has("KeyW"));
  const magnitude = Math.hypot(inputX, inputY) || 1;
  const targetVX = inputX * 64 / magnitude;
  const targetVY = inputY * 64 / magnitude;
  const response = 1 - Math.exp(-dt * 13);
  state.vx += (targetVX - state.vx) * response;
  state.vy += (targetVY - state.vy) * response;
  const previousX = state.x, previousY = state.y;
  state.x = clamp(state.x + state.vx * dt, -worldLimit, worldLimit);
  state.y = clamp(state.y + state.vy * dt, -worldLimit, worldLimit);
  const actualVX = (state.x - previousX) / dt;
  const actualVY = (state.y - previousY) / dt;

  const deadZoneX = Math.min(75, canvas.width * 0.19);

  const deadZoneY = Math.min(70, verticalRoom / squash);

    for (const [bx, by, sx, sy] of [[left, top, 1, 1], [right, top, -1, 1], [left, bottom, 1, -1], [right, bottom, -1, -1]]) {
      ctx.fillRect(bx + Math.min(0, sx * 13), by, 13, 1);
      ctx.fillRect(bx, by + Math.min(0, sy * 9), 1, 9);
    }
  }
  const edge = groundPoint(-worldLimit, -worldLimit);
  ctx.strokeStyle = "#a9a77c";
  ctx.setLineDash([5, 4]);
  ctx.strokeRect(Math.round(edge.x) + 0.5, Math.round(edge.y) + 0.5, worldLimit * 2, Math.round(worldLimit * 2 * squash));
  ctx.setLineDash([]);
}

function stridePose(leg, motion) {
  const phase = (state.phase + leg.group * 0.5) % 1;
  const stance = phase < 0.56;
  const swing = stance ? 0 : (phase - 0.56) / 0.44;
  const progress = stance ? 0.5 - phase / 0.56 : ease(swing) - 0.5;
  const span = state.gait * 0.56 / motion.frequency;
  const groundX = leg.hipX + leg.side * 12;
  const groundY = leg.hipY + leg.station * 17;
  return {
    leg,
    x: clamp((motion.vx - motion.spin * groundY) * span * progress, -12, 12),
    y: clamp((motion.vy + motion.spin * groundX) * span * progress, -13, 13),
    lift: Math.sin(Math.PI * swing) * state.gait * 7,
  };
}

function drawRobot(motion) {
  const point = groundPoint(state.x, state.y);
  const cx = model.width / 2, cy = 138;
  const dx = Math.round(point.x - cx), dy = Math.round(point.y - cy);
  const bob = state.gait * (1 - Math.cos(state.phase * Math.PI * 4)) * 0.8;
  layers.clearRect(0, 0, model.width, model.height);
  const poses = legs.map(leg => stridePose(leg, motion));
  const c = Math.cos(state.turn), s = Math.sin(state.turn);
  const shade = "#141d218a";
  ctx.fillStyle = shade;
  ctx.beginPath();
  ctx.ellipse(point.x + 2, point.y + 2, 29, 19, 0, 0, Math.PI * 2);
  ctx.fill();
  for (const { leg, x, y, lift } of poses) {
    const footX = leg.hipX + leg.side * 11 + x;
    const footY = leg.hipY + leg.station * 18 + y;
    const sx = Math.round(point.x + c * footX - s * footY);
    const sy = Math.round(point.y + (s * footX + c * footY) * squash);
    ctx.fillStyle = lift < 1.5 ? "#131c21a8" : "#1822276c";
    ctx.fillRect(sx - 4, sy - 2, 8, 4);
  }

  // All modules are interleaved by elevation, so a leg is never painted over the whole hull.
  const bodyBase = 26 + Math.round(bob);
  for (let z = 0; z < bodyBase + art.body.n; z++) {
    layers.setTransform(c, squash * s, -s, squash * c, cx, cy - z);
    for (const pose of poses) {
      const { leg, lift } = pose;
      const part = leg.art;
      const localZ = Math.round((z - lift) / (1 + (bob - lift) / (part.n - 1)));
      if (localZ < 0 || localZ >= part.n) continue;
      const blend = 1 - localZ / (part.n - 1);
      layers.save();
      layers.translate(leg.hipX + pose.x * blend, leg.hipY + pose.y * blend);
      layers.scale(leg.side, leg.station === -1 ? -1 : 1);
      layers.drawImage(part.image, part.w * localZ, 0, part.w, part.h, -4.5, -4, part.w, part.h);
      layers.restore();
    }
    const bodyZ = z - bodyBase;
    const body = art.body;
    if (bodyZ >= 0 && bodyZ < body.n) {
      layers.drawImage(body.image, body.w * bodyZ, 0, body.w, body.h, -body.w * 0.5, -body.h * 0.5, body.w, body.h);
    }
  }
  layers.resetTransform();
  maskCtx.clearRect(0, 0, mask.width, mask.height);
  maskCtx.drawImage(model, 0, 0);
  maskCtx.globalCompositeOperation = "source-in";
  maskCtx.fillStyle = "#12191d";
  maskCtx.fillRect(0, 0, mask.width, mask.height);
  maskCtx.globalCompositeOperation = "source-over";
  for (const [x, y] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.drawImage(mask, dx + x, dy + y);
  ctx.drawImage(model, dx, dy);
}

function drawAim() {
  if (!pointer.active) return;
  const point = pointerOnCanvas();
  const x = Math.round(point.x), y = Math.round(point.y);
  ctx.fillStyle = "#d7e69e";
  ctx.fillRect(x - 7, y, 4, 1);
  ctx.fillRect(x + 4, y, 4, 1);
  ctx.fillRect(x, y - 7, 1, 4);
  ctx.fillRect(x, y + 4, 1, 4);
}

function frame(timestamp) {
  const dt = clamp((timestamp - (previousTime || timestamp)) * 0.001, 0.001, 0.033);
  previousTime = timestamp;
  const motion = update(dt);
  drawFloor();
  drawRobot(motion);
  drawAim();
  requestAnimationFrame(frame);
}

window.addEventListener("keydown", event => {
  if (controls.has(event.code) && !event.metaKey && !event.ctrlKey && !event.altKey) {
    event.preventDefault();
    setKey(event.code, true);
  }
});
window.addEventListener("keyup", event => {
  if (controls.has(event.code)) setKey(event.code, false);
});
window.addEventListener("blur", clearKeys);
document.addEventListener("visibilitychange", clearKeys);
canvas.addEventListener("pointermove", aim);
canvas.addEventListener("pointerdown", event => {
  aim(event);
  stage.focus({ preventScroll: true });
});
document.querySelector("#reset").addEventListener("click", reset);
for (const button of document.querySelectorAll("#touch button")) {
  const code = button.dataset.code;
  button.addEventListener("pointerdown", event => {
    button.setPointerCapture(event.pointerId);
    pointer.active = false;
    setKey(code, true);
  });
  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    button.addEventListener(type, () => setKey(code, false));
  }
}

Promise.all(Object.values(art).map(loadStrip)).then(() => {
  resize();
  new ResizeObserver(resize).observe(stage);
  requestAnimationFrame(frame);
}).catch(error => {
  console.error(error);
  status.textContent = "Loading failed";
  document.querySelector("#load-error").hidden = false;
});
</script>
</body>
</html>
