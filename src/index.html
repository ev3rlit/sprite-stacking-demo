<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargo Rover · Runtime Sprite Stacking</title>
<!-- STYLES -->
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1 id="assetTitle">Cargo Rover</h1></div>
    <div class="controls" role="group" aria-label="Drive mode">
      <button id="patrol" aria-pressed="true">Auto Patrol</button>
      <button id="manual" aria-pressed="false">Manual</button>
      <button id="reset">Reset</button>
    </div>
  </header>
  <section class="stage" aria-label="Industrial test yard">
    <canvas id="yard" aria-label="Cargo rover driving view"></canvas>
    <div class="stage-hud">
      <div class="stats">
        <div><span>Status</span><output id="status">Loading</output></div>
        <div><span>Speed</span><output id="speed">0 px/s</output></div>
      </div>
      <div class="stats performance-stats" role="group" aria-label="Rendering performance">
        <div><span>FPS</span><output id="frameFps" aria-live="off">—</output></div>
        <div><span>Frame Time</span><output id="frameTime" aria-live="off">— ms</output></div>
        <div><span>Render CPU</span><output id="renderTime" aria-live="off">— ms</output></div>
      </div>
    </div>
    <div class="touch" aria-label="Touch driving controls">
      <div><button data-key="left" aria-label="Turn Left">◀</button><button data-key="right" aria-label="Turn Right">▶</button>
        <button data-key="turnLeft" data-ant-turn hidden aria-label="Rotate body left">↶</button>
        <button data-key="turnRight" data-ant-turn hidden aria-label="Rotate body right">↷</button></div>
      <div><button data-key="reverse">Reverse</button><button data-key="forward">Forward</button></div>
    </div>
  </section>
  <div class="asset-controls" role="group" aria-label="Vehicles and rendering">
    <div class="vehicle-picker" id="vehiclePicker" role="group" aria-label="Vehicle selection">
      <button type="button" class="vehicle-option" data-vehicle="rover" aria-pressed="true">
        <img class="vehicle-icon" src="../assets/icons/rover.png" alt="" width="48" height="34"><span>Cargo Rover</span>
      </button>
      <button type="button" class="vehicle-option" data-vehicle="inspection" aria-pressed="false">
        <img class="vehicle-icon" src="../assets/icons/inspection.png" alt="" width="48" height="34"><span>Inspection Robot</span>
      </button>
      <button type="button" class="vehicle-option" data-vehicle="ant" aria-pressed="false">
        <img class="vehicle-icon" src="../assets/icons/ant.png" alt="" width="48" height="34"><span>Ant Mech</span>
      </button>
      <button type="button" class="vehicle-option" data-vehicle="custom" aria-pressed="false" hidden>
        <span class="vehicle-custom-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Custom Four-View Asset</span>
      </button>
    </div>
    <button id="openFourViews" type="button" title="PNG with top, left, front, and rear views in one row">Open Four-View PNG</button>
    <input id="fourViewFile" type="file" accept="image/png" hidden>
    <div class="ability-bar">
      <button id="mobilityAbility" type="button" aria-pressed="false">Boost · Shift</button>
      <output id="abilityStatus">Ready</output>
    </div>
    <div class="techniques" role="group" aria-label="Rendering">
      <span class="global-label">Rendering</span>
      <button id="meshMode" type="button" aria-pressed="true">Marching Cubes</button>
      <button id="multiViewMode" type="button" aria-pressed="true">Multi-View Texturing</button>
      <button id="materialLight" type="button" aria-pressed="true">Material Lighting</button>
      <button id="detailNormal" type="button" aria-pressed="true">Detail Normals</button>
      <button id="subpixelAA" type="button" aria-pressed="true" title="Sample edge coverage at four points per pixel">Subpixel AA</button>
      <button id="specularAA" type="button" aria-pressed="true" title="Reduce specular shimmer where normals vary rapidly">Specular AA</button>
    </div>
  </div>
  <div class="tuning-panels">
    <section class="tuning-panel" aria-labelledby="mobilityPanelTitle">
      <div class="tuning-heading">
        <h2 id="mobilityPanelTitle">Mobility</h2>
        <button id="resetView" type="button" aria-label="Reset mobility settings">Defaults</button>
      </div>
      <div class="tuning-fields">
        <div class="view-control">
          <label for="spacing">Spacing <output id="spacingValue" for="spacing" aria-hidden="true">1.00</output></label>
          <input id="spacing" type="range" min="0.50" max="2.50" step="0.05" value="1.00" title="Layer spacing for the selected vehicle">
        </div>
        <div class="view-control">
          <label for="layerCount">Layers <output id="layerValue" for="layerCount" aria-hidden="true">90</output></label>
          <input id="layerCount" type="range" min="30" max="120" step="1" value="90" title="Body layer count">
        </div>
        <div class="view-control">
          <label for="textureScale">Texture Resolution <output id="textureValue" for="textureScale" aria-hidden="true">1.50×</output></label>
          <input id="textureScale" type="range" min="0.75" max="2" step="0.25" value="1.5" title="Horizontal slice resolution">
        </div>
      </div>
      <div class="tuning-fields mobility-tuning" id="mobilityTuning" role="group" aria-label="Vehicle-specific controls"></div>
      <div class="tuning-status">
        <output id="pipelineStatus" aria-live="polite">Preparing four-view input…</output>
        <span id="activeLayers"></span>
      </div>
    </section>
    <section class="tuning-panel" aria-labelledby="environmentPanelTitle">
      <div class="tuning-heading">
        <h2 id="environmentPanelTitle">Environment &amp; Props</h2>
        <button id="resetEnvironment" type="button" aria-label="Reset environment and prop settings">Defaults</button>
      </div>
      <div class="tuning-fields environment-fields">
        <div class="view-control">
          <label for="propSpacing">Prop Spacing <output id="propSpacingValue" for="propSpacing" aria-hidden="true">1.00</output></label>
          <input id="propSpacing" type="range" min="0.50" max="2.50" step="0.05" value="1.00" title="Canister layer spacing">
        </div>
        <div class="view-control">
          <label for="floorBrightness">Floor Brightness <output id="floorBrightnessValue" for="floorBrightness" aria-hidden="true">100%</output></label>
          <input id="floorBrightness" type="range" min="0.50" max="1.50" step="0.05" value="1.00">
        </div>
        <div class="view-control">
          <label for="squash">Squash <output id="squashValue" for="squash" aria-hidden="true">0.75</output></label>
          <input id="squash" type="range" min="0.45" max="1.00" step="0.01" value="0.75" title="Shared camera angle">
        </div>
        <div class="view-control">
          <label for="scale">Scale <output id="scaleValue" for="scale" aria-hidden="true">1.00×</output></label>
          <input id="scale" type="range" min="0.50" max="2.00" step="0.05" value="1.00" title="Shared view scale">
        </div>
      </div>
      <div class="tuning-status">
        <button type="button" id="supersample" aria-pressed="true">Supersampling 2×</button>
        <output id="obstacleTelemetry">Loading props</output>
        <button type="button" id="resetCanisters">Reset Props</button>
      </div>
    </section>
  </div>
  <footer><div class="keys" id="mobilityHelp">WASD / arrow keys to drive · Shift to boost · Space to stop</div><span>Four-view assets · Separate body and wheels</span></footer>
</main>
<!-- SCRIPTS -->
</body>
</html>
